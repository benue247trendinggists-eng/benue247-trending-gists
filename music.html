<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseUrl = "https://zvhbtaokljksjamkxwon.supabase.co/rest/v1/";
const supabaseKey = "sb_publishable_YF-IQhjeGymnEDsX-X2BEQ_Ul9-st_m";
const supabaseClient = window.supabase.createClient(
  supabaseUrl,
  supabaseKey
);

async function loadMusic() {
  const musicList = document.getElementById("musicList");

  musicList.innerHTML = `
    <div class="empty">Loading music...</div>
  `;

  const { data, error } = await supabaseClient
    .from("music")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    console.error("Music error:", error);

    musicList.innerHTML = `
      <div class="empty">
        <h3>Unable to load music</h3>
        <p>${error.message}</p>
      </div>
    `;

    return;
  }

  if (!data || data.length === 0) {
    musicList.innerHTML = `
      <div class="empty">
        <h3>No music uploaded yet 🎵</h3>
        <p>Check back soon for new songs.</p>
      </div>
    `;

    return;
  }

  musicList.innerHTML = "";

  data.forEach(song => {

    const cover = song.cover_url
      ? `<img class="cover" src="${song.cover_url}" alt="${song.title}">`
      : "";

    const description = song.description
      ? `<p>${song.description}</p>`
      : "";

    const genre = song.genre
      ? `<small>Genre: ${song.genre}</small>`
      : "";

    musicList.innerHTML += `
      <article class="song">

        ${cover}

        <h2>${song.title || "Untitled Song"}</h2>

        <div class="artist">
          🎤 ${song.artist || "Unknown Artist"}
        </div>

        ${genre}

        ${description}

        <audio controls preload="metadata">
          <source src="${song.audio_url}" type="audio/mpeg">
          Your browser does not support audio playback.
        </audio>

        <a
          class="download"
          href="${song.audio_url}"
          download
        >
          ⬇️ Download
        </a>

      </article>
    `;
  });
}

loadMusic();
</script>
