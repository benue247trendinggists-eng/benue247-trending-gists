<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story | Benue24/7</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><header><div class="brand">BENUE <b>24/7</b> TRENDING GISTS</div><nav><a href="index.html">Home</a></nav></header><main class="article"><div id="story">Loading story...</div></main><script>
const cfg=window.BENUE247_CONFIG||{};const db=cfg.SUPABASE_URL?window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY):null;const esc=s=>(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function run(){if(!db){story.innerHTML='<p>Connect Supabase in config.js.</p>';return}let slug=new URLSearchParams(location.search).get('slug');let {data:p,error}=await db.from('posts').select('*').eq('slug',slug).eq('published',true).single();if(error){story.innerHTML='<p>Story not found.</p>';return}document.title=p.title+' | Benue24/7';story.innerHTML=`<small>${esc(p.category)}</small><h1>${esc(p.title)}</h1><p class="date">${new Date(p.created_at).toLocaleString()}</p>${p.image_url?`<img class="article-img" src="${esc(p.image_url)}" alt="">`:''}<div class="body">${esc(p.body).replace(/\n/g,'<br>')}</div>`}run();
</script></body></html>
