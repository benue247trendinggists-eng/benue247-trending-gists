<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Benue24/7 Trending Gists</title>

  <meta
    name="description"
    content="Read the latest news, trending stories, entertainment, sports and politics from Benue and beyond."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;
      color: #111827;
      line-height: 1.7;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* HEADER */

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 28px 15px;
    }

    header h1 {
      font-size: 28px;
      font-weight: 800;
    }

    header p {
      color: #d1d5db;
      margin-top: 5px;
      font-size: 14px;
    }

    /* NAVIGATION */

    nav {
      background: #222;
      color: white;
      display: flex;
      justify-content: center;
      gap: 5px;
      padding: 12px;
      overflow-x: auto;
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    nav a {
      padding: 8px 13px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
    }

    nav a:hover {
      background: white;
      color: #111;
    }

    /* MAIN */

    main {
      max-width: 900px;
      margin: auto;
      padding: 25px 15px 60px;
    }

    /* ARTICLE */

    .article {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    .article-image {
      width: 100%;
      max-height: 500px;
      object-fit: cover;
      display: block;
    }

    .article-content {
      padding: 30px;
    }

    .tag {
      display: inline-block;
      background: #111;
      color: white;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .article h2 {
      font-size: 36px;
      line-height: 1.25;
      margin-bottom: 15px;
    }

    .meta {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 25px;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 15px;
    }

    .article-description {
      font-size: 18px;
      font-weight: 600;
      color: #4b5563;
      margin-bottom: 25px;
    }

    .article-story {
      font-size: 18px;
      color: #1f2937;
      white-space: pre-line;
    }

    .article-story p {
      margin-bottom: 20px;
    }

    /* SHARE */

    .share-box {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #e5e7eb;
    }

    .share-box h3 {
      margin-bottom: 12px;
    }

    .share-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .share-button {
      display: inline-block;
      padding: 10px 15px;
      border-radius: 7px;
      background: #111;
      color: white;
      font-weight: bold;
      font-size: 14px;
    }

    .back-button {
      display: inline-block;
      margin-top: 25px;
      padding: 12px 18px;
      background: #111;
      color: white;
      border-radius: 7px;
      font-weight: bold;
    }

    /* MESSAGE */

    .message {
      background: white;
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      color: #6b7280;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

    .message h2 {
      color: #111827;
      margin-bottom: 10px;
    }

    /* FOOTER */

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 35px 15px;
    }

    footer p {
      color: #bbb;
      margin-top: 8px;
      font-size: 14px;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      header h1 {
        font-size: 23px;
      }

      nav {
        justify-content: flex-start;
      }

      .article-content {
        padding: 20px;
      }

      .article h2 {
        font-size: 27px;
      }

      .article-description {
        font-size: 16px;
      }

      .article-story {
        font-size: 17px;
      }

      .article-image {
        max-height: 350px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>BENUE24/7 TRENDING GISTS</h1>

    <p>
      News • Trending Gists • Entertainment • Sports • Politics • Music
    </p>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="index.html#news">News</a>
    <a href="index.html#trending">Trending</a>
    <a href="index.html#entertainment">Entertainment</a>
    <a href="index.html#sports">Sports</a>
    <a href="index.html#politics">Politics</a>
    <a href="music.html">Music</a>
  </nav>

  <main>

    <div id="articleContainer">
      <div class="message">
        Loading story...
      </div>
    </div>

  </main>

  <footer>

    <h3>BENUE24/7 TRENDING GISTS</h3>

    <p>
      News • Trending Gists • Entertainment • Sports • Politics • Music
    </p>

    <p>
      © 2026 Benue24/7 Trending Gists
    </p>

  </footer>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js"></script>


  <script>

    let supabaseClient = null;

    try {

      if (
        typeof SUPABASE_URL !== "undefined" &&
        typeof SUPABASE_ANON_KEY !== "undefined"
      ) {

        supabaseClient = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_ANON_KEY
        );

      }

    } catch (error) {

      console.error("Supabase error:", error);

    }


    function escapeHTML(value) {

      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    async function loadArticle() {

      const container =
        document.getElementById("articleContainer");

      if (!supabaseClient) {

        container.innerHTML = `
          <div class="message">
            <h2>Unable to load story</h2>
            <p>Supabase connection is not configured.</p>
          </div>
        `;

        return;

      }


      const params =
        new URLSearchParams(window.location.search);

      const slug =
        params.get("slug");


      if (!slug) {

        container.innerHTML = `
          <div class="message">
            <h2>Story not found</h2>
            <p>No story was specified.</p>
            <a class="back-button" href="index.html">
              ← Back to Home
            </a>
          </div>
        `;

        return;

      }


      const result =
        await supabaseClient
          .from("article")
          .select("*")
          .eq("slug", slug)
          .limit(1)
          .maybeSingle();


      if (result.error) {

        console.error(result.error);

        container.innerHTML = `
          <div class="message">
            <h2>Unable to load story</h2>
            <p>${escapeHTML(result.error.message)}</p>
            <a class="back-button" href="index.html">
              ← Back to Home
            </a>
          </div>
        `;

        return;

      }


      const article = result.data;


      if (!article) {

        container.innerHTML = `
          <div class="message">
            <h2>Story not found</h2>
            <p>This story may have been removed or the link is incorrect.</p>
            <a class="back-button" href="index.html">
              ← Back to Home
            </a>
          </div>
        `;

        return;

      }


      const title =
        article.title ||
        article.headline ||
        "Untitled story";


      const category =
        article.category ||
        "News";


      const description =
        article.description ||
        article.excerpt ||
        "";


      const story =
        article.story ||
        article.content ||
        article.body ||
        "";


      const author =
        article.author ||
        "Benue24/7 Trending Gists";


      const date =
        article.created_at
          ? new Date(
              article.created_at
            ).toLocaleString()
          : "";


      const image =
        article.image_url ||
        article.cover_url ||
        article.image ||
        "";


      document.title =
        title + " | Benue24/7 Trending Gists";


      const imageHTML =
        image
          ? `
            <img
              class="article-image"
              src="${escapeHTML(image)}"
              alt="${escapeHTML(title)}"
            >
          `
          : "";


      const descriptionHTML =
        description
          ? `
            <div class="article-description">
              ${escapeHTML(description)}
            </div>
          `
          : "";


      const storyHTML =
        story
          ? `
            <div class="article-story">
              ${escapeHTML(story)}
            </div>
          `
          : `
            <div class="article-story">
              No full story available.
            </div>
          `;


      const shareURL =
        window.location.href;


      const whatsappURL =
        "https://wa.me/?text=" +
        encodeURIComponent(
          title + "\n\n" + shareURL
        );


      const facebookURL =
        "https://www.facebook.com/sharer/sharer.php?u=" +
        encodeURIComponent(shareURL);


      container.innerHTML = `

        <article class="article">

          ${imageHTML}

          <div class="article-content">

            <span class="tag">
              ${escapeHTML(category)}
            </span>

            <h2>
              ${escapeHTML(title)}
            </h2>

            <div class="meta">

              By <strong>
                ${escapeHTML(author)}
              </strong>

              ${date ? " • " + escapeHTML(date) : ""}

            </div>

            ${descriptionHTML}

            ${storyHTML}

            <div class="share-box">

              <h3>
                📲 Share this story
              </h3>

              <div class="share-buttons">

                <a
                  class="share-button"
                  href="${whatsappURL}"
                  target="_blank"
                  rel="noopener"
                >
                  WhatsApp
                </a>

                <a
                  class="share-button"
                  href="${facebookURL}"
                  target="_blank"
                  rel="noopener"
                >
                  Facebook
                </a>

                <button
                  class="share-button"
                  onclick="copyStoryLink()"
                  style="border:0; cursor:pointer;"
                >
                  Copy Link
                </button>

              </div>

            </div>

            <a
              class="back-button"
              href="index.html"
            >
              ← Back to Home
            </a>

          </div>

        </article>

      `;

    }


    async function copyStoryLink() {

      try {

        await navigator.clipboard.writeText(
          window.location.href
        );

        alert("Story link copied!");

      } catch (error) {

        alert(
          "Unable to copy link. Please copy the URL manually."
        );

      }

    }


    loadArticle();

  </script>

</body>
</html>
