<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Publish | Benue24/7</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
      padding: 20px;
    }

    .container {
      max-width: 760px;
      margin: auto;
    }

    .top {
      background: #111827;
      color: white;
      padding: 22px;
      border-radius: 14px;
      margin-bottom: 20px;
    }

    .top h1 {
      margin: 0 0 6px;
    }

    .top p {
      margin: 0;
      color: #d1d5db;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .actions a,
    .logout {
      flex: 1;
      padding: 11px;
      text-align: center;
      border-radius: 8px;
      border: none;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }

    .actions a {
      background: white;
      color: #111827;
    }

    .logout {
      background: #dc2626;
      color: white;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin: 18px 0 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
    }

    textarea {
      min-height: 220px;
      resize: vertical;
    }

    .small {
      min-height: 100px;
    }

    .help {
      background: #f9fafb;
      padding: 12px;
      border-radius: 8px;
      margin-top: 8px;
      color: #6b7280;
      font-size: 13px;
    }

    .publish {
      width: 100%;
      padding: 15px;
      margin-top: 25px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .publish:disabled {
      opacity: .6;
    }

    .status {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

  </style>

</head>

<body>

  <div class="container">

    <div class="top">

      <h1>📰 Benue24/7 Publisher</h1>

      <p>
        Publish news, trending gists and stories.
      </p>

      <div class="actions">

        <a href="index.html">
          🏠 Website
        </a>

        <button
          class="logout"
          id="logoutButton"
        >
          Logout
        </button>

      </div>

    </div>


    <div class="box">

      <form id="publishForm">

        <label>
          Headline *
        </label>

        <input
          id="title"
          type="text"
          placeholder="Enter headline"
          required
        >


        <label>
          Category *
        </label>

        <select
          id="category"
          required
        >

          <option value="news">
            📰 News
          </option>

          <option value="trending">
            🔥 Trending Gists
          </option>

          <option value="entertainment">
            🎬 Entertainment
          </option>

          <option value="sports">
            ⚽ Sports
          </option>

          <option value="politics">
            🏛️ Politics
          </option>

        </select>


        <label>
          Short Description
        </label>

        <textarea
          id="description"
          class="small"
          placeholder="Short summary..."
        ></textarea>


        <label>
          Image URL
        </label>

        <input
          id="image"
          type="url"
          placeholder="https://example.com/image.jpg"
        >

        <div class="help">
          Leave empty if the story has no image.
        </div>


        <label>
          Full Story *
        </label>

        <textarea
          id="content"
          placeholder="Write the complete story..."
          required
        ></textarea>


        <label>
          Author
        </label>

        <input
          id="author"
          type="text"
          value="Benue24/7 Trending Gists"
        >


        <button
          class="publish"
          id="publishButton"
          type="submit"
        >
          🚀 Publish Story
        </button>

      </form>


      <div
        id="status"
        class="status"
      ></div>

    </div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js"></script>


  <script>

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    const form =
      document.getElementById("publishForm");

    const status =
      document.getElementById("status");

    const publishButton =
      document.getElementById("publishButton");

    const logoutButton =
      document.getElementById("logoutButton");


    async function checkLogin() {

      const {
        data: { session }
      } =
        await supabaseClient.auth.getSession();


      if (!session) {

        window.location.href =
          "login.html";

        return false;

      }

      return true;

    }


    checkLogin();


    logoutButton.addEventListener(
      "click",
      async function() {

        await supabaseClient.auth.signOut();

        window.location.href =
          "login.html";

      }
    );


    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const loggedIn =
          await checkLogin();

        if (!loggedIn) return;


        const title =
          document.getElementById("title")
          .value.trim();


        const category =
          document.getElementById("category")
          .value;


        const description =
          document.getElementById("description")
          .value.trim();


        const image =
          document.getElementById("image")
          .value.trim();


        const content =
          document.getElementById("content")
          .value.trim();


        const author =
          document.getElementById("author")
          .value.trim()
          || "Benue24/7 Trending Gists";


        if (!title || !content) {

          showStatus(
            "Please enter a headline and full story.",
            "error"
          );

          return;

        }


        publishButton.disabled = true;

        publishButton.textContent =
          "Publishing...";


        const slug =
          createSlug(title);


        const {
          error
        } =
          await supabaseClient
            .from("article")
            .insert({

              title: title,

              slug: slug,

              category: category,

              description:
                description || null,

              content: content,

              image_url:
                image || null,

              author: author

            });


        if (error) {

          showStatus(
            "Publishing failed: " +
            error.message,
            "error"
          );

          publishButton.disabled = false;

          publishButton.textContent =
            "🚀 Publish Story";

          return;

        }


        showStatus(
          "✅ Story published successfully!",
          "success"
        );


        form.reset();


        document.getElementById("author")
          .value =
          "Benue24/7 Trending Gists";


        publishButton.disabled = false;

        publishButton.textContent =
          "🚀 Publish Story";

      }
    );


    function createSlug(text) {

      return text
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9\s-]/g, "")
        .replace(/\s+/g, "-")
        .replace(/-+/g, "-")
        .replace(/^-|-$/g, "")
        + "-" +
        Date.now();

    }


    function showStatus(
      message,
      type
    ) {

      status.textContent =
        message;

      status.className =
        "status " + type;

    }

  </script>

</body>

</html>
