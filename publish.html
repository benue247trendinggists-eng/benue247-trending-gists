<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Publish | Benue24/7 Trending Gists</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;
      color: #111827;
      padding: 20px;
    }

    .container {
      max-width: 760px;
      margin: auto;
    }

    .header {
      background: #111827;
      color: white;
      padding: 25px;
      border-radius: 14px;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 26px;
      margin-bottom: 7px;
    }

    .header p {
      color: #d1d5db;
      font-size: 14px;
    }

    .back {
      display: inline-block;
      margin-top: 15px;
      color: white;
      text-decoration: underline;
      font-size: 14px;
    }

    .form-box {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin: 18px 0 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 13px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #111827;
    }

    textarea {
      min-height: 220px;
      resize: vertical;
    }

    .small-textarea {
      min-height: 100px;
    }

    .help {
      background: #f9fafb;
      padding: 12px;
      border-radius: 8px;
      margin-top: 8px;
      color: #6b7280;
      font-size: 13px;
    }

    button {
      width: 100%;
      border: none;
      background: #111827;
      color: white;
      padding: 15px;
      border-radius: 8px;
      margin-top: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #374151;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .status {
      display: none;
      padding: 14px;
      border-radius: 8px;
      margin-top: 18px;
      font-weight: bold;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .form-box {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>📰 Publish to Benue24/7</h1>

      <p>
        Publish news, trending gists, entertainment, sports and politics.
      </p>

      <a class="back" href="index.html">
        ← Back to website
      </a>
    </div>

    <div class="form-box">

      <form id="publishForm">

        <label for="title">
          Headline *
        </label>

        <input
          id="title"
          type="text"
          placeholder="Enter your news headline"
          required
        >

        <label for="category">
          Category *
        </label>

        <select id="category" required>
          <option value="news">📰 News</option>
          <option value="trending">🔥 Trending Gists</option>
          <option value="entertainment">🎬 Entertainment</option>
          <option value="sports">⚽ Sports</option>
          <option value="politics">🏛️ Politics</option>
        </select>

        <label for="description">
          Short Description
        </label>

        <textarea
          id="description"
          class="small-textarea"
          placeholder="Write a short summary of the story..."
        ></textarea>

        <label for="image">
          Image URL
        </label>

        <input
          id="image"
          type="url"
          placeholder="https://example.com/image.jpg"
        >

        <div class="help">
          Paste the public URL of the story image.
          We can add direct image uploading later.
        </div>

        <label for="content">
          Full Story *
        </label>

        <textarea
          id="content"
          placeholder="Write the complete story here..."
          required
        ></textarea>

        <label for="author">
          Author
        </label>

        <input
          id="author"
          type="text"
          value="Benue24/7 Trending Gists"
        >

        <button
          id="publishButton"
          type="submit"
        >
          🚀 Publish Story
        </button>

      </form>

      <div id="status" class="status"></div>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js"></script>

  <script>

    let supabaseClient = null;

    try {

      if (
        typeof SUPABASE_URL !== "undefined" &&
        typeof SUPABASE_ANON_KEY !== "undefined"
      ) {

        supabaseClient =
          window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
          );

      }

    } catch (error) {

      console.error(error);

    }

    const form =
      document.getElementById("publishForm");

    const status =
      document.getElementById("status");

    const button =
      document.getElementById("publishButton");

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        if (!supabaseClient) {

          showStatus(
            "Supabase is not configured correctly.",
            "error"
          );

          return;

        }

        const title =
          document.getElementById("title").value.trim();

        const category =
          document.getElementById("category").value;

        const description =
          document.getElementById("description").value.trim();

        const image =
          document.getElementById("image").value.trim();

        const content =
          document.getElementById("content").value.trim();

        const author =
          document.getElementById("author").value.trim()
          || "Benue24/7 Trending Gists";

        if (!title || !content) {

          showStatus(
            "Please enter a headline and full story.",
            "error"
          );

          return;

        }

        button.disabled = true;
        button.textContent = "Publishing...";

        const slug =
          createSlug(title);

        const article = {

          title: title,

          slug: slug,

          category: category,

          description: description || null,

          content: content,

          image_url: image || null,

          author: author

        };

        const result =
          await supabaseClient
            .from("article")
            .insert(article)
            .select()
            .single();

        if (result.error) {

          console.error(result.error);

          if (result.error.code === "23505") {

            showStatus(
              "This headline has already been published. Change the headline slightly and try again.",
              "error"
            );

          } else {

            showStatus(
              "Publishing failed: " +
              result.error.message,
              "error"
            );

          }

          button.disabled = false;
          button.textContent = "🚀 Publish Story";

          return;

        }

        showStatus(
          "✅ Story published successfully!",
          "success"
        );

        form.reset();

        document.getElementById("author").value =
          "Benue24/7 Trending Gists";

        button.disabled = false;
        button.textContent = "🚀 Publish Story";

      }
    );

    function createSlug(text) {

      return text
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9\s-]/g, "")
        .replace(/\s+/g, "-")
        .replace(/-+/g, "-")
        .replace(/^-|-$/g, "")
        + "-" + Date.now();

    }

    function showStatus(message, type) {

      status.textContent = message;

      status.className =
        "status " + type;

    }

  </script>

</body>
</html>
