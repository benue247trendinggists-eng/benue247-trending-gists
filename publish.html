<script>

let supabaseClient = null;


/* =========================================
   CONNECT TO SUPABASE
========================================= */

try {

  if (
    typeof SUPABASE_URL !== "undefined" &&
    typeof SUPABASE_ANON_KEY !== "undefined"
  ) {

    supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

  } else {

    console.error(
      "SUPABASE_URL or SUPABASE_ANON_KEY is missing."
    );

  }

} catch (error) {

  console.error(
    "Supabase connection error:",
    error
  );

}


/* =========================================
   CHECK ADMIN LOGIN
========================================= */

async function checkAdminLogin() {

  if (!supabaseClient) {

    showMessage(
      "Supabase connection is not configured.",
      "error"
    );

    return false;

  }

  try {

    const result =
      await supabaseClient.auth.getSession();

    if (
      result.error ||
      !result.data ||
      !result.data.session
    ) {

      showMessage(
        "Please login to your admin account before publishing.",
        "error"
      );

      return false;

    }

    return true;

  } catch (error) {

    console.error(
      "Login check error:",
      error
    );

    showMessage(
      "Unable to verify your admin login.",
      "error"
    );

    return false;

  }

}


/* =========================================
   CREATE SLUG
========================================= */

function createSlug(text) {

  return text
    .toLowerCase()
    .trim()
    .replace(
      /[^a-z0-9\s-]/g,
      ""
    )
    .replace(
      /\s+/g,
      "-"
    )
    .replace(
      /-+/g,
      "-"
    )
    +
    "-" +
    Date.now();

}


/* =========================================
   SHOW MESSAGE
========================================= */

function showMessage(
  text,
  type
) {

  const box =
    document.getElementById(
      "message"
    );

  box.textContent =
    text;

  box.className =
    "message " + type;

}


/* =========================================
   IMAGE PREVIEW
========================================= */

function previewImage(event) {

  const file =
    event.target.files[0];

  const preview =
    document.getElementById(
      "imagePreview"
    );

  const image =
    document.getElementById(
      "previewImage"
    );

  const name =
    document.getElementById(
      "imageName"
    );

  const status =
    document.getElementById(
      "uploadStatus"
    );


  if (!file) {

    preview.style.display =
      "none";

    return;

  }


  if (
    !file.type.startsWith(
      "image/"
    )
  ) {

    showMessage(
      "Please choose a valid image file.",
      "error"
    );

    event.target.value = "";

    return;

  }


  /*
    Allow up to 10MB before compression.
    The image will be reduced before upload.
  */

  if (
    file.size >
    10 * 1024 * 1024
  ) {

    showMessage(
      "Image is too large. Maximum size is 10MB.",
      "error"
    );

    event.target.value = "";

    return;

  }


  const objectURL =
    URL.createObjectURL(
      file
    );


  image.src =
    objectURL;


  name.textContent =
    file.name +
    " (" +
    formatFileSize(file.size) +
    ")";


  status.style.display =
    "none";


  preview.style.display =
    "block";


  showMessage(
    "",
    ""
  );

}


/* =========================================
   FILE SIZE
========================================= */

function formatFileSize(bytes) {

  if (bytes < 1024) {

    return bytes + " B";

  }

  if (bytes < 1024 * 1024) {

    return (
      (bytes / 1024).toFixed(1) +
      " KB"
    );

  }

  return (
    (bytes / (1024 * 1024)).toFixed(1) +
    " MB"
  );

}


/* =========================================
   COMPRESS IMAGE
========================================= */

async function compressImage(file) {

  /*
    If image is already small, use it directly.
  */

  if (
    file.size <=
    1.5 * 1024 * 1024 &&
    file.type === "image/jpeg"
  ) {

    return file;

  }


  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();


      reader.onload = function(event) {

        const img =
          new Image();


        img.onload = function() {

          const maxWidth =
            1600;

          const maxHeight =
            1600;


          let width =
            img.width;

          let height =
            img.height;


          /*
            Resize large phone photos.
          */

          if (
            width > maxWidth ||
            height > maxHeight
          ) {

            const ratio =
              Math.min(
                maxWidth / width,
                maxHeight / height
              );

            width =
              Math.round(
                width * ratio
              );

            height =
              Math.round(
                height * ratio
              );

          }


          const canvas =
            document.createElement(
              "canvas"
            );


          canvas.width =
            width;

          canvas.height =
            height;


          const ctx =
            canvas.getContext(
              "2d"
            );


          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );


          canvas.toBlob(
            function(blob) {

              if (!blob) {

                reject(
                  new Error(
                    "Image compression failed."
                  )
                );

                return;

              }


              const compressedFile =
                new File(
                  [
                    blob
                  ],
                  "story-" +
                  Date.now() +
                  ".jpg",
                  {
                    type:
                      "image/jpeg"
                  }
                );


              resolve(
                compressedFile
              );

            },
            "image/jpeg",
            0.82
          );

        };


        img.onerror =
          function() {

            reject(
              new Error(
                "This image format cannot be processed by your browser."
              )
            );

          };


        img.src =
          event.target.result;

      };


      reader.onerror =
        function() {

          reject(
            new Error(
              "Unable to read the selected image."
            )
          );

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================================
   UPLOAD IMAGE TO SUPABASE
========================================= */

async function uploadStoryImage(file) {

  if (!file) {

    return null;

  }


  const status =
    document.getElementById(
      "uploadStatus"
    );


  status.textContent =
    "Preparing image...";

  status.style.display =
    "block";


  /*
    Compress image first.
  */

  const uploadFile =
    await compressImage(
      file
    );


  status.textContent =
    "Uploading image...";


  /*
    IMPORTANT:
    Your bucket is exactly:

    Images
  */

  const bucketName =
    "Images";


  const filePath =
    "stories/" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2, 10) +
    ".jpg";


  /*
    Upload with timeout.
    This prevents the page from staying
    on "Uploading image..." forever.
  */

  const uploadPromise =
    supabaseClient.storage
      .from(bucketName)
      .upload(
        filePath,
        uploadFile,
        {
          cacheControl: "3600",
          upsert: false,
          contentType: "image/jpeg"
        }
      );


  const timeoutPromise =
    new Promise(
      (_, reject) => {

        setTimeout(
          () => {

            reject(
              new Error(
                "Image upload timed out. Please check your internet connection and try again."
              )
            );

          },
          60000
        );

      }
    );


  const result =
    await Promise.race([
      uploadPromise,
      timeoutPromise
    ]);


  if (result.error) {

    console.error(
      "Supabase image upload error:",
      result.error
    );


    throw new Error(
      "Image upload failed: " +
      result.error.message
    );

  }


  status.textContent =
    "Creating image URL...";


  /*
    Get public URL.
  */

  const publicResult =
    supabaseClient.storage
      .from(bucketName)
      .getPublicUrl(
        filePath
      );


  const publicUrl =
    publicResult.data &&
    publicResult.data.publicUrl;


  if (!publicUrl) {

    throw new Error(
      "Image uploaded, but Supabase could not create the public image URL."
    );

  }


  status.textContent =
    "✅ Image uploaded successfully.";


  return publicUrl;

}


/* =========================================
   PUBLISH STORY
========================================= */

async function publishStory() {

  const button =
    document.getElementById(
      "publishButton"
    );


  /*
    Prevent double clicking.
  */

  if (button.disabled) {

    return;

  }


  /*
    CHECK LOGIN
  */

  const loggedIn =
    await checkAdminLogin();


  if (!loggedIn) {

    return;

  }


  /*
    GET FORM DATA
  */

  const title =
    document.getElementById(
      "title"
    ).value.trim();


  const category =
    document.getElementById(
      "category"
    ).value;


  const description =
    document.getElementById(
      "description"
    ).value.trim();


  const story =
    document.getElementById(
      "story"
    ).value.trim();


  const author =
    document.getElementById(
      "author"
    ).value.trim();


  const imageInput =
    document.getElementById(
      "storyImage"
    );


  const imageFile =
    imageInput.files[0];


  /*
    VALIDATE TITLE
  */

  if (!title) {

    showMessage(
      "Please enter a story title.",
      "error"
    );

    return;

  }


  /*
    VALIDATE STORY
  */

  if (!story) {

    showMessage(
      "Please enter the full story.",
      "error"
    );

    return;

  }


  /*
    DISABLE BUTTON
  */

  button.disabled =
    true;

  button.textContent =
    "Publishing...";


  try {

    /*
      STEP 1
      Upload image.
    */

    let image_url =
      null;


    if (imageFile) {

      showMessage(
        "Preparing your image...",
        "success"
      );


      image_url =
        await uploadStoryImage(
          imageFile
        );

    }


    /*
      STEP 2
      Create slug.
    */

    const slug =
      createSlug(
        title
      );


    /*
      STEP 3
      Prepare article.
    */

    const article = {

      title:
        title,

      slug:
        slug,

      description:
        description,

      story:
        story,

      image_url:
        image_url,

      category:
        category,

      author:
        author ||
        "Benue24/7 Trending Gists"

    };


    /*
      STEP 4
      Save story.
    */

    showMessage(
      "Saving your story...",
      "success"
    );


    const result =
      await supabaseClient
        .from("article")
        .insert([
          article
        ])
        .select();


    if (result.error) {

      console.error(
        "Database publishing error:",
        result.error
      );


      throw new Error(
        "Publishing failed: " +
        result.error.message
      );

    }


    /*
      SUCCESS
    */

    showMessage(
      "✅ Story published successfully!",
      "success"
    );


    document.getElementById(
      "preview"
    ).style.display =
      "block";


    /*
      CLEAR FORM
    */

    document.getElementById(
      "title"
    ).value = "";


    document.getElementById(
      "description"
    ).value = "";


    document.getElementById(
      "story"
    ).value = "";


    document.getElementById(
      "storyImage"
    ).value = "";


    document.getElementById(
      "imagePreview"
    ).style.display =
      "none";


    document.getElementById(
      "uploadStatus"
    ).style.display =
      "none";


  } catch (error) {

    console.error(
      "Publish error:",
      error
    );


    showMessage(
      "❌ " +
      (
        error.message ||
        "Something went wrong while publishing."
      ),
      "error"
    );

  }


  /*
    ENABLE BUTTON
  */

  button.disabled =
    false;

  button.textContent =
    "🚀 Publish Story";

}

</script>

</body>
</html>
