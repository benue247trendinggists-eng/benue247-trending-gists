<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin Login | Benue24/7</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,.3);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 25px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 17px 0 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    button:disabled {
      opacity: .6;
    }

    .message {
      margin-top: 18px;
      padding: 13px;
      border-radius: 8px;
      display: none;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #374151;
    }

  </style>

</head>

<body>

  <div class="login-box">

    <h1>🔐 Benue24/7 Admin</h1>

    <div class="subtitle">
      Sign in to publish stories
    </div>

    <form id="loginForm">

      <label for="email">
        Email
      </label>

      <input
        id="email"
        type="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        id="password"
        type="password"
        placeholder="Enter your password"
        required
      >

      <button
        id="loginButton"
        type="submit"
      >
        🔐 Login
      </button>

    </form>

    <div
      id="message"
      class="message"
    ></div>

    <a
      class="back"
      href="index.html"
    >
      ← Back to website
    </a>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js"></script>


  <script>

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    const form =
      document.getElementById("loginForm");

    const button =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");


    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        button.disabled = true;
        button.textContent = "Logging in...";

        message.className = "message";
        message.textContent = "";


        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;


        const { error } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });


        if (error) {

          message.className =
            "message error";

          message.textContent =
            "Login failed: " + error.message;

          button.disabled = false;
          button.textContent = "🔐 Login";

          return;

        }


        message.className =
          "message success";

        message.textContent =
          "✅ Login successful. Opening publisher...";


        setTimeout(function() {

          window.location.href =
            "publish.html";

        }, 700);

      }
    );

  </script>

</body>

</html>
